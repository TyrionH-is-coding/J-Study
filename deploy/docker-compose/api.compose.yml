services:
  jstudy-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: jstudy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_API_KEY_FILE: ${SILICONFLOW_API_KEY_FILE:-}
      SILICONFLOW_CHAT_MODEL: ${SILICONFLOW_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Pro}
      SILICONFLOW_EMBED_MODEL: ${SILICONFLOW_EMBED_MODEL:-BAAI/bge-m3}
      JSTUDY_ADMIN_TOKEN: ${JSTUDY_ADMIN_TOKEN:-}
      JSTUDY_SETTINGS_DIR: /app/data/settings
      JSTUDY_JOBS_DIR: /app/data/jobs
      JSTUDY_SOUL_PATH: /app/soul.md
      JSTUDY_MNEMONICS_PATH: /app/mnemonics.md
      JSTUDY_MAX_PDF_BYTES: ${JSTUDY_MAX_PDF_BYTES:-52428800}
      JSTUDY_JOB_RETENTION_HOURS: ${JSTUDY_JOB_RETENTION_HOURS:-72}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jstudy:jstudy-dev-password@postgres:5432/jstudy}
      JSTUDY_SESSION_SECRET: ${JSTUDY_SESSION_SECRET:-dev-session-secret-change-me}
      JSTUDY_COOKIE_SECURE: ${JSTUDY_COOKIE_SECURE:-false}
      JSTUDY_SESSION_COOKIE_NAME: ${JSTUDY_SESSION_COOKIE_NAME:-jstudy_session}
    ports:
      - "${JSTUDY_API_PORT:-8765}:8765"
    volumes:
      - ../../data/jobs:/app/data/jobs
      - ../../data/settings:/app/data/settings
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    container_name: jstudy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jstudy}
      POSTGRES_USER: ${POSTGRES_USER:-jstudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jstudy-dev-password}
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
